<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Recomp Logbuch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one column gym logbook, sticky day switcher with progress bar, fixed rest timer at the bottom.
   Design rules: OLED black only; suggestions are faint, entered values are bold; accent orange marks progress and the next
   open exercise; amber marks hernia safety notes; green marks finished work. */
/* OLED dark only: pure black background so unused pixels stay off; surfaces are barely lifted. */
:root{
  --bg:#000000; --surface:#0d0f11; --ink:#eef1f3; --muted:#9ba5ae; --faint:#59626b; --line:#252a30; --field:#000000;
  --accent:#ff6b2c; --accent-ink:#160800; --ok:#5fd47a; --ok-bg:#0b2213; --ss:#91a7ff; --ss-bg:#141b33;
  --warn:#ffc65c; --warn-bg:#1c1606; --warn-line:#7a5a12;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",-apple-system,"Segoe UI",Arial,sans-serif;
  --radius:12px; --radius-s:8px; --tap:44px; --header-h:0px;
  padding-top:env(safe-area-inset-top,0px); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(120px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 10px;display:grid;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:var(--tap)}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
h1 em{font-style:normal;color:var(--accent)}
.status{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.status #status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{width:var(--tap);height:var(--tap);margin-right:-10px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:var(--radius-s)}
.gear svg{width:22px;height:22px}
.gear[aria-expanded="true"]{color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days button{font-family:var(--display);font-size:17px;font-weight:700;min-height:52px;padding:6px 2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius-s);line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
.days button small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;margin-top:2px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s ease}
.progress.full i{background:var(--ok)}

/* Day intro */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 0 2px}
.daytitle{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;margin:0}
.count{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:15px;color:var(--muted);font-weight:600}
.meta{font-size:13px;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}

/* General warm up and hernia box */
.general{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;font-size:15px;line-height:1.45}
.general summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--tap);padding:6px 12px;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.general summary::-webkit-details-marker{display:none}
.general summary .sub{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.general .body{padding:0 12px 12px;display:grid;gap:10px}
.general .body p{margin:0}
.general .body b{font-family:var(--display);font-size:15px;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:2px}
.general .safety{background:var(--warn-bg);border-left:3px solid var(--warn-line);border-radius:0 var(--radius-s) var(--radius-s) 0;padding:8px 10px}
.general .safety b{color:var(--warn)}
.chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}

/* Exercise cards */
.list{display:grid;gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 4px;display:grid;gap:8px;position:relative;scroll-margin-top:calc(var(--header-h) + 12px)}
.ex.next{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ex.done{border-color:var(--ok);background:linear-gradient(var(--ok-bg),var(--ok-bg)) top/100% 0 no-repeat,var(--surface)}
.ex.done .exname{color:var(--muted)}
.ex.ssA,.ex.ssB{border-left:4px solid var(--ss)}
.ex.ssA{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:-12px;border-bottom-style:dashed}
.ex.ssB{border-top-left-radius:0;border-top-right-radius:0}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{font-weight:600;font-size:17px;line-height:1.25;min-width:0}
.tags{display:flex;gap:4px 6px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:12px}
.tag{letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px;font-weight:600;line-height:1.3}
.tag.m{background:var(--ink);color:var(--bg)}
.tag.p{border:1px solid var(--line);color:var(--ink)}
.tag.ss{color:var(--ss);background:var(--ss-bg)}
.spec{color:var(--muted);font-variant-numeric:tabular-nums}
.done-pill{font-family:var(--display);font-size:17px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:2px 10px;line-height:1.3}
.ex.next .done-pill{color:var(--accent);border-color:var(--accent)}
.done-pill.full{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.last{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.last b{color:var(--ink);font-weight:600}
.hint{font-size:14px;color:var(--accent);font-weight:600}
.warm{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 9px;font-variant-numeric:tabular-nums}
.warm b{font-weight:600;color:var(--ink)}

/* Set rows */
.sets{display:grid;gap:8px;margin-top:2px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 56px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-size:18px;font-weight:600;color:var(--muted);text-align:center}
.field{position:relative;display:block}
.field input{width:100%;height:52px;font:700 22px/1 var(--display);letter-spacing:.01em;padding:0 64px 0 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.field.kg input{padding-right:34px}
.field input::placeholder{color:var(--faint);font-weight:500;opacity:1}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;line-height:1.15;color:var(--muted);pointer-events:none;text-align:right}
.field span b{display:block;font-family:var(--display);font-size:15px;font-weight:700;color:var(--ink)}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;background:var(--surface)}
.chk{height:52px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.chk svg{width:24px;height:24px}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.set.on .field input{border-color:var(--ok);background:var(--surface)}
.set.on .field.miss input{border-color:var(--warn-line);background:var(--warn-bg)}
.set .missing{grid-column:2/4;font-size:12px;font-weight:600;color:var(--warn);margin-top:-4px}

/* Notes */
details.note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);margin:4px -12px 0;padding:0 12px}
details.note summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:var(--tap);font-weight:600;color:var(--muted)}
details.note summary::-webkit-details-marker{display:none}
details.note.risk summary{color:var(--warn)}
details.note p{margin:0 0 10px;color:var(--ink);line-height:1.45}

/* Timer, toast, settings */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);color:var(--ink);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;transform:translateY(110%);transition:transform .2s;box-shadow:0 -8px 24px rgb(0 0 0 / .8)}
.timer.show{transform:none}
.timer .t{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px;line-height:1}
.timer .lbl{flex:1;min-width:0;font-size:13px;line-height:1.25;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.timer button{font:600 15px var(--body);border:1px solid var(--line);border-radius:var(--radius-s);min-height:var(--tap);padding:0 14px;background:var(--bg);color:var(--ink)}
.timer #tskip{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.timer.zero{background:var(--accent);color:var(--accent-ink)}
.timer.zero #tskip{background:var(--accent-ink);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ss);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:25;max-width:calc(100% - 32px)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;gap:6px;font-size:13px}
.settings label{font-weight:600;color:var(--muted)}
.settings input{font:16px var(--body);min-height:var(--tap);padding:0 10px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--field);color:var(--ink);width:100%}
.settings button{font:600 15px var(--body);min-height:var(--tap);padding:0 14px;border:0;border-radius:var(--radius-s);background:var(--accent);color:var(--accent-ink);width:100%;margin-top:4px}
.settings p{margin:0;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.timer,.progress i,.chev{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header id="header">
    <div class="top">
      <h1>Recomp <em>Logbuch</em></h1>
      <span class="status"><span id="status">Verbinde Speicher…</span>
        <button type="button" id="gear" class="gear" aria-label="Einstellungen" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </span>
    </div>
    <div class="settings" id="settings" hidden>
      <label for="sheetUrl">Google Apps Script URL</label><input id="sheetUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <label for="sheetToken">Token</label><input id="sheetToken" placeholder="dein geheimes Token" autocomplete="off">
      <button type="button" id="sheetSave">Speichern &amp; synchronisieren</button>
      <p>Ohne URL speichert die Seite nur auf diesem Gerät.</p>
    </div>
    <div class="days" id="days" role="group" aria-label="Trainingstag"></div>
    <div class="progress" id="progress" role="progressbar" aria-label="Sätze erledigt" aria-valuemin="0"><i></i></div>
  </header>
  <main>
    <div class="dayhead"><h2 class="daytitle" id="daytitle"></h2><div class="count" id="count"></div></div>
    <div class="meta" id="meta"></div>
    <details class="general" id="general"><summary><span>Vor dem Training <span class="sub" id="generalSub"></span></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="body" id="generalBody"></div></details>
    <div class="list" id="list"></div>
  </main>
</div>
<div class="timer" id="timer" aria-live="polite">
  <div class="t" id="tval">0:00</div>
  <div class="lbl" id="tlbl">Pause</div>
  <button id="tplus" type="button">+30 s</button>
  <button id="tskip" type="button">Fertig</button>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>

function lsGet(){ try { return JSON.parse(localStorage.getItem("recomp-logs")||"{}"); } catch(e){ return {}; } }
function lsSet(){ try { localStorage.setItem("recomp-logs", JSON.stringify(logs)); } catch(e){} }
function sheetCfg(){ try { return JSON.parse(localStorage.getItem("recomp-sheet")||"null"); } catch(e){ return null; } }
function flatRows(body){
  const rows=[]; const day=PLAN.find(d=>d.tag===body.tag);
  Object.keys(body.sets||{}).forEach(id=>{ const ex=(day&&day.ex.find(e=>e.id===id))||{name:id,muscle:""};
    body.sets[id].forEach((st,k)=>{ if(st.done) rows.push([body.date, body.tag, ex.name, ex.muscle, k+1, parseFloat(String(st.kg).replace(",","."))||"", parseInt(st.reps)||""]); }); });
  return rows;
}
function sheetPush(id, body){
  const c=sheetCfg(); if(!c||!c.url) return Promise.resolve(false);
  return fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:c.token,id,data:body,rows:flatRows(body)})})
    .then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error); return true; });
}
function sheetPull(){
  const c=sheetCfg(); if(!c||!c.url) return Promise.resolve(null);
  return fetch(c.url+(c.url.includes("?")?"&":"?")+"token="+encodeURIComponent(c.token||"")).then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error); return j.logs||[]; });
}
function docId(tag){ return today + "_" + tag.replace(" ","-"); }

function pickDefault(){
  const wd = new Date().getDay();
  const map = {1:"Tag 1",3:"Tag 2",5:"Tag 3",0:"Tag 4"};
  if (map[wd]) return map[wd];
  const past = Object.values(logs).filter(l=>l && l.date<=today).sort((a,b)=>a.date<b.date?1:-1);
  if (!past.length) return "Tag 1";
  if (past[0].date===today) return past[0].tag;
  const order=["Tag 1","Tag 2","Tag 3","Tag 4"];
  return order[(order.indexOf(past[0].tag)+1)%4];
}

function lastFor(exId){
  const cand = Object.values(logs).filter(l => l && l.sets && l.sets[exId] && l.sets[exId].some(s=>s.done) && !(l.date===today && session && l.tag===session.tag))
    .sort((a,b)=> a.date<b.date?1:-1);
  if (!cand.length) return null;
  return {date:cand[0].date, sets:cand[0].sets[exId].filter(s=>s.done)};
}
function firstNum(v){ const m=String(v||"").replace(",",".").match(/\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function r25(x){ return Math.max(2.5, Math.round(x/2.5)*2.5); }
const REGION={"Chest":"push","Push Delts":"push","Triceps":"push","Lat":"pull","Traps":"pull","Rear Delts":"pull","Biceps":"pull","Forearms":"pull","Side Delts":"side","Quads":"legs","Hamstrings":"legs","Glutes":"legs","Adductor":"legs","Calves":"legs","Abs":"abs"};
function warmupFor(ex, day, idx, last){
  const reg=REGION[ex.muscle]||ex.muscle;
  const firstInRegion = day.ex.findIndex(e=>(REGION[e.muscle]||e.muscle)===reg)===idx;
  if (!firstInRegion || reg==="abs") return "";
  const kg = last && last.sets.length ? firstNum(last.sets[0].kg) : firstNum(ex.lastLoad);
  const f = x => r25(x).toString().replace(".",",");
  const firstOfDay = idx===0;
  if (firstOfDay){
    return kg ? "<b>"+f(kg*0.5)+" kg × 8</b>, <b>"+f(kg*0.75)+" kg × 3</b>, dann Arbeitssatz" : "2 Sätze: leicht × 8, mittel × 3";
  }
  return kg ? "1 Satz <b>"+f(kg*0.6)+" kg × 5</b>" : "1 Satz leicht × 5";
}
function estimate(day){
  let m=7;
  day.ex.forEach((e,i)=>{ const w=warmupFor(e,day,i,lastFor(e.id)); if(w) m+= /× 8/.test(w)?2:1; m+= e.sets*(e.ss?1.75:(e.kind==="I"?2.5:3)); });
  return Math.round(m);
}
function rangeTop(range){ const m=String(range).match(/(\d+)\s*$/); return m?+m[1]:null; }

function renderDays(){
  const box=$("days"); box.innerHTML="";
  PLAN.forEach(d=>{
    const b=document.createElement("button"); b.type="button"; b.id="day-"+d.tag.replace(" ","");
    b.setAttribute("aria-pressed", String(current===d.tag));
    const [wd,name]=SHORT[d.tag];
    b.innerHTML=wd+"<small>"+name+"</small>";
    b.onclick=()=>{ selectDay(d.tag); };
    box.appendChild(b);
  });
}

function selectDay(tag){
  flush();
  current=tag;
  const id=docId(tag);
  session = logs[id] ? JSON.parse(JSON.stringify(logs[id])) : {date:today, tag, sets:{}};
  renderDays(); render();
}

function ensureSets(ex){
  if (!session.sets[ex.id]) session.sets[ex.id]=Array.from({length:ex.sets},()=>({kg:"",reps:"",done:false}));
  while (session.sets[ex.id].length<ex.sets) session.sets[ex.id].push({kg:"",reps:"",done:false});
  return session.sets[ex.id];
}

function setCount(day){
  const total=day.ex.reduce((a,e)=>a+e.sets,0);
  const done=day.ex.reduce((a,e)=>a+(session.sets[e.id]||[]).filter(s=>s.done).length,0);
  return {total, done};
}

function renderHeader(day){
  const {total, done}=setCount(day);
  $("daytitle").textContent=day.label;
  $("count").innerHTML=done+"<small> / "+total+"</small>";
  const bar=$("progress");
  bar.querySelector("i").style.width=(total?Math.round(done/total*100):0)+"%";
  bar.classList.toggle("full", total>0 && done>=total);
  bar.setAttribute("aria-valuemax", total); bar.setAttribute("aria-valuenow", done);
  $("meta").textContent="ca. "+estimate(day)+" min inkl. Aufwärmen, "+new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  return done;
}

function renderGeneral(day, done){
  const g=GENERAL[/Upper/.test(day.label)?"upper":"lower"];
  $("generalSub").textContent="Aufwärmen 7 min, Hiatushernie";
  $("generalBody").innerHTML='<p><b>Aufwärmen allgemein</b>'+esc(g.warm)+'</p><p class="safety"><b>Hiatushernie</b>'+esc(g.hernia)+'</p>';
  if (!(current in generalOpen)) generalOpen[current] = done===0;
  $("general").open = generalOpen[current];

function rangeFullHint(ex, last){
  if (!last) return "";
  const t1=rangeTop(ex.r1), t2=rangeTop(ex.r2)||t1;
  const full=last.sets.length>=ex.sets && last.sets.every((s,k)=>+s.reps>=(k===0?t1:t2));
  return full ? "Range voll: Last erhöhen (+2,5 bis 5 %)" : "";
}

function cardHead(ex, nDone){
  return '<div class="exhead"><div class="exname">'+esc(ex.name)+'<div class="tags">'+
    (ex.ss?'<span class="tag ss">Supersatz '+esc(ex.ss)+'</span>':'')+
    '<span class="tag m">'+esc(ex.muscle)+'</span>'+
    (ex.rest?'<span class="tag p">Pause '+fmt(ex.rest)+'</span>':'')+
    '<span class="spec">RIR '+esc(ex.rir)+'</span><span class="spec">Tempo '+esc(ex.tempo)+'</span>'+
    '</div></div><div class="done-pill'+(nDone>=ex.sets?' full':'')+'">'+nDone+'/'+ex.sets+'</div></div>';
}

function cardNote(ex){
  const risk=/Hernie/.test(ex.tip);
  return '<details class="note'+(risk?' risk':'')+'"><summary>'+(risk?'Hernie beachten':'Hinweis')+ICON_CHEV+'</summary><p>'+esc(ex.tip)+'</p></details>';
}

function render(){
  const day=PLAN.find(d=>d.tag===current);
  const done=renderHeader(day);
  renderGeneral(day, done);
  const list=$("list"); list.innerHTML="";
  let nextMarked=false;
  day.ex.forEach((ex,i)=>{
    const sets=ensureSets(ex);
    const last=lastFor(ex.id);
    const nDone=sets.filter(s=>s.done).length;
    const full=nDone>=ex.sets;
    const isNext=!full && !nextMarked; if (isNext) nextMarked=true;
    const card=document.createElement("section");
    card.id="ex-"+ex.id;
    card.className="ex"+(ex.ss?(ex.ss[0]==="A"?" ssA":" ssB"):"")+(full?" done":"")+(isNext?" next":"");
    const hint=rangeFullHint(ex, last);
    const wu=warmupFor(ex, day, i, last);
    card.innerHTML=cardHead(ex, nDone)+
      '<div class="last">'+lastText(ex, last)+'</div>'+(hint?'<div class="hint">'+hint+'</div>':'')+
      (wu?'<div class="warm">Aufwärmen: '+wu+' (kein Arbeitssatz)</div>':'')+
      '<div class="sets"></div>'+cardNote(ex);
    const box=card.querySelector(".sets");
    sets.forEach((s,k)=>box.appendChild(setRow(ex, day, s, k, last)));
    list.appendChild(card);
  });
}

// One set row: weight, reps (with target range), done button. Faint placeholders are suggestions from last time.
function setRow(ex, day, s, k, last){
  const prev = last ? (last.sets[k] || last.sets[last.sets.length-1]) : null;
  const kgPh = prev && isNum(prev.kg) ? prev.kg : (isNum(ex.lastLoad) ? ex.lastLoad : "");
  const rpPh = prev && isNum(prev.reps) ? prev.reps : "";
  const rng = k===0 ? ex.r1 : (ex.r2 && ex.r2!=="-" ? ex.r2 : ex.r1);
  const missKg = s.done && !s.kg, missRp = s.done && !s.reps;
  const row=document.createElement("div"); row.className="set"+(s.done?" on":"");
  row.innerHTML='<div class="n">'+(k+1)+'</div>'+
    '<label class="field kg'+(missKg?' miss':'')+'"><input id="kg-'+ex.id+'-'+k+'" inputmode="decimal" enterkeyhint="next" placeholder="'+esc(String(kgPh).replace(".",","))+'" value="'+esc(String(s.kg).replace(".",","))+'" aria-label="Gewicht Satz '+(k+1)+'"><span>kg</span></label>'+
    '<label class="field rp'+(missRp?' miss':'')+'"><input id="rp-'+ex.id+'-'+k+'" inputmode="numeric" enterkeyhint="done" placeholder="'+esc(rpPh)+'" value="'+esc(s.reps)+'" aria-label="Wiederholungen Satz '+(k+1)+', Ziel '+esc(rng)+'"><span>Ziel<b>'+esc(rng)+'</b></span></label>'+
    '<button type="button" class="chk" aria-pressed="'+s.done+'" aria-label="Satz '+(k+1)+' erledigt">'+ICON_CHECK+'</button>'+
    ((missKg||missRp)?'<div class="missing">'+(missKg&&missRp?'Gewicht und Wdh fehlen':missKg?'Gewicht fehlt':'Wdh fehlt')+'</div>':'');
  const [kgI,rpI]=row.querySelectorAll("input");
  kgI.oninput=()=>{ s.kg=kgI.value.replace(",","."); queueSave(); };
  rpI.oninput=()=>{ s.reps=rpI.value; queueSave(); };
  row.querySelector(".chk").onclick=()=>toggleSet(ex, day, s, kgPh, rpPh || rangeTop(rng));
  return row;
}

function toggleSet(ex, day, s, kgSuggest, repsSuggest){
  unlockAudio();
  if (s.done){ s.done=false; queueSave(); render(); return; }
  if (!s.kg && isNum(kgSuggest)) s.kg=String(kgSuggest).replace(",",".");
  if (!s.reps && repsSuggest) s.reps=String(repsSuggest);
  s.done=true;
  const wasFirst = setCount(day).done===1;
  if (wasFirst) generalOpen[current]=false;
  queueSave(); render();
  if (session.sets[ex.id].every(x=>x.done)) scrollToNextAfter(ex.id);
  if (ex.ss && ex.ss[0]==="A"){
    const partner=day.ex.find(e=>e.ss==="B"+ex.ss.slice(1));
    toast("Weiter ohne Pause: "+(partner?partner.name:"B-Übung"));
  } else startTimer(ex.rest||90, ex.name);
}

// After finishing an exercise, scroll to the next open exercise below it (not back up to skipped ones).
function scrollToNextAfter(exId){
  const cards=[...document.querySelectorAll(".ex")];
  const from=cards.findIndex(c=>c.id==="ex-"+exId);
  const next=cards.slice(from+1).find(c=>!c.classList.contains("done")); if (!next) return;
  document.documentElement.style.setProperty("--header-h", $("header").offsetHeight+"px");
  next.scrollIntoView({behavior: prefersReducedMotion()?"auto":"smooth", block:"start"});
}
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); }
function flush(){
  if (!session) return;
  clearTimeout(saveTimer);
  const hasData=Object.values(session.sets).some(a=>a.some(s=>s.kg||s.reps||s.done));
  if (!hasData) return;
  const id=docId(session.tag);
  const body=JSON.parse(JSON.stringify(session));
  body.updated=Date.now();
  logs[id]=body;
  if (db){
    saving = saving.then(()=>db.collection("logs").doc(id).set(body)).then(()=>setStatus("Gespeichert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}))).catch(e=>{ lsSet(); setStatus("Cloud-Fehler, lokal gesichert"); });
  } else {
    lsSet();
    if (sheetCfg()) { saving = saving.then(()=>sheetPush(id, body)).then(()=>setStatus("Im Sheet gespeichert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}))).catch(()=>setStatus("Sheet nicht erreichbar, lokal gesichert")); }
    else setStatus("Lokal gespeichert");
  }
}
function setStatus(t){ $("status").textContent=t; }

// Rest timer
let tEnd=0, tInt=null, actx=null;
function unlockAudio(){
  try { if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==="suspended") actx.resume(); } catch(e){}
  if (navigator.wakeLock && !window._wl){ navigator.wakeLock.request("screen").then(w=>{window._wl=w; w.addEventListener("release",()=>{window._wl=null;});}).catch(()=>{}); }
}
function beep(){
  if(!actx) return;
  try { [0,0.25,0.5].forEach(o=>{ const g=actx.createGain(), osc=actx.createOscillator(); osc.frequency.value=880; g.gain.value=0.25; osc.connect(g); g.connect(actx.destination); osc.start(actx.currentTime+o); osc.stop(actx.currentTime+o+0.15); }); } catch(e){}
}
function startTimer(sec,label){
  tEnd=Date.now()+sec*1000; $("tlbl").textContent=label;
  $("timer").classList.add("show"); $("timer").classList.remove("zero");
  clearInterval(tInt); tick(); tInt=setInterval(tick,250);
}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $("tval").textContent=fmt(left);
  if(left===0 && !$("timer").classList.contains("zero")){ $("timer").classList.add("zero"); $("tlbl").textContent="Nächster Satz"; beep(); }
}
$("tplus").onclick=()=>{ tEnd=Math.max(tEnd,Date.now())+30000; $("timer").classList.remove("zero"); tick(); };
$("tskip").onclick=()=>{ clearInterval(tInt); $("timer").classList.remove("show"); };
let toastT=null;
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2600); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); else if(navigator.wakeLock && !window._wl && actx){ navigator.wakeLock.request("screen").then(w=>{window._wl=w;}).catch(()=>{}); } });

// Boot: local first, then cloud
logs=lsGet(); current=pickDefault(); selectDay(current);
let fallback=setTimeout(()=>{ if(mode==="connecting"){ mode="local"; setStatus("Nur lokal gespeichert"); } },10000);
(async()=>{
  try {
    const d = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if(!d){ clearTimeout(fallback); mode="local"; startSheet(); return; }
    db=d;
    let first=true;
    db.collection("logs").onSnapshot(snap=>{
      clearTimeout(fallback); mode="cloud";
      const local=lsGet();
      const remote={}; snap.docs.forEach(doc=>{ if(doc.exists) remote[doc.id]=doc.data(); });
      // push anything that only exists locally
      if(first){ Object.keys(local).forEach(k=>{ if(!remote[k] || (local[k].updated||0)>(remote[k].updated||0)){ remote[k]=local[k]; saving=saving.then(()=>db.collection("logs").doc(k).set(local[k])).catch(()=>{}); } }); first=false; }
      const mine = session ? docId(session.tag) : null;
      const keepSession = mine && logs[mine] && remote[mine] && (logs[mine].updated||0) > (remote[mine].updated||0);
      logs=remote; if(keepSession) logs[mine]=JSON.parse(JSON.stringify(session));
      lsSet();
      setStatus("Synchronisiert");
      const active=document.activeElement && document.activeElement.tagName==="INPUT";
      if(!active) render();
    }, err=>{ mode="local"; setStatus("Cloud nicht erreichbar, lokal"); });
  } catch(e){ clearTimeout(fallback); mode="local"; startSheet(); }
})();
function startSheet(){
  if(!sheetCfg()){ setStatus("Nur lokal gespeichert"); return; }
  setStatus("Lade aus Sheet…");
  sheetPull().then(list=>{
    const local=lsGet(); const merged=Object.assign({},local);
    (list||[]).forEach(x=>{ if(x&&x.data&&(!merged[x.id]||(x.data.updated||0)>(merged[x.id].updated||0))) merged[x.id]=x.data; });
    Object.keys(local).forEach(k=>{ const r=(list||[]).find(x=>x.id===k); if(!r||(local[k].updated||0)>(r.data.updated||0)) sheetPush(k,local[k]).catch(()=>{}); });
    logs=merged; lsSet();
    const mine=docId(current); if(logs[mine]) session=JSON.parse(JSON.stringify(logs[mine]));
    render(); setStatus("Mit Sheet synchronisiert");
  }).catch(()=>setStatus("Sheet nicht erreichbar, lokal"));
}
$("gear").onclick=()=>{ const st=$("settings"); st.hidden=!st.hidden; $("gear").setAttribute("aria-expanded", String(!st.hidden)); const c=sheetCfg()||{}; $("sheetUrl").value=c.url||""; $("sheetToken").value=c.token||""; };
$("sheetSave").onclick=()=>{ const url=$("sheetUrl").value.trim(), token=$("sheetToken").value.trim();
  try { if(url) localStorage.setItem("recomp-sheet",JSON.stringify({url,token})); else localStorage.removeItem("recomp-sheet"); } catch(e){}
  $("settings").hidden=true; $("gear").setAttribute("aria-expanded","false"); if(!db) startSheet(); };
$("general").addEventListener("toggle", ()=>{ generalOpen[current]=$("general").open; });
</script>
