<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logbuch">
<meta name="theme-color" content="#15191d">

<body>
<title>Recomp Logbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one column gym logbook, sticky day switcher, fixed rest timer at the bottom */
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#15191d; --muted:#5d6670; --line:#d5dade;
  --accent:#d9480f; --accent-ink:#ffffff; --ok:#2b8a3e; --ok-bg:#e3f4e6; --ss:#3b5bdb; --ss-bg:#e7ecff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1215; --surface:#1a1f24; --ink:#e9edf0; --muted:#97a1aa; --line:#2c333a;
  --accent:#ff6b2c; --accent-ink:#160800; --ok:#69db7c; --ok-bg:#16301c; --ss:#91a7ff; --ss-bg:#1c2442; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1215; --surface:#1a1f24; --ink:#e9edf0; --muted:#97a1aa; --line:#2c333a;
  --accent:#ff6b2c; --accent-ink:#160800; --ok:#69db7c; --ok-bg:#16301c; --ss:#91a7ff; --ss-bg:#1c2442; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 140px;max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;display:grid;gap:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.status{font-size:12px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days button{font-family:var(--display);font-size:15px;font-weight:600;padding:8px 2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;line-height:1.1}
.days button small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.daytitle{font-family:var(--display);font-size:20px;font-weight:600;margin:8px 0 2px}
.meta{font-size:13px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
.list{display:grid;gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.ex.ssA,.ex.ssB{border-left:4px solid var(--ss)}
.ex.ssA{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:-10px;border-bottom-style:dashed}
.ex.ssB{border-top-left-radius:0;border-top-right-radius:0}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exname{font-weight:600;font-size:16px;line-height:1.25;min-width:0}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.tag.ss{color:var(--ss);background:var(--ss-bg);border-color:transparent;font-weight:600}
.done-pill{font-family:var(--display);font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.done-pill.full{color:var(--ok)}
.last{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.last b{color:var(--ink);font-weight:600}
.hint{font-size:13px;color:var(--accent);font-weight:600}
.warm{font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:7px 9px;font-variant-numeric:tabular-nums}
.warm b{font-weight:600}
.general{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.4;margin-bottom:10px}
.general b{font-family:var(--display);font-size:15px;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:2px}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:6px;align-items:center}
.set .n{font-family:var(--display);font-size:17px;color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;font:600 18px/1 var(--body);padding:10px 34px 10px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.field span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.chk{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;font-weight:700}
.chk[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.set.on .field input{border-color:var(--ok)}
.range{font-size:11px;color:var(--muted);grid-column:2/4;margin-top:-2px}
details{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted)}
.empty{font-size:13px;color:var(--muted);padding:6px 0}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;transform:translateY(110%);transition:transform .2s}
.timer.show{transform:none}
.timer .t{font-family:var(--display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px}
.timer .lbl{flex:1;min-width:0;font-size:13px;line-height:1.3;opacity:.85}
.timer button{font:600 14px var(--body);border:0;border-radius:8px;padding:10px 12px;background:var(--bg);color:var(--ink)}
.timer.zero .t{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ss);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;font-weight:600;z-index:25;max-width:calc(100% - 32px)}
.gear{border:0;background:none;color:var(--muted);font-size:18px;padding:0 0 0 6px;cursor:pointer}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;font-size:13px}
.settings input{font:15px var(--body);padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.settings button{font:600 14px var(--body);padding:9px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.settings p{margin:0;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.timer{transition:none}}
</style>
<div class="wrap">
  <header>
    <div class="top"><h1>Recomp Logbuch</h1><span class="status"><span id="status">Verbinde Speicher…</span> <button type="button" id="gear" class="gear" aria-label="Einstellungen">⚙</button></span></div>
    <div class="settings" id="settings" hidden>
      <label for="sheetUrl">Google Apps Script URL</label><input id="sheetUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <label for="sheetToken">Token</label><input id="sheetToken" placeholder="dein geheimes Token" autocomplete="off">
      <div class="row"><button type="button" id="sheetSave">Speichern &amp; synchronisieren</button></div>
      <p>Ohne URL speichert die Seite nur auf diesem Gerät.</p>
    </div>
    <div class="days" id="days" role="group" aria-label="Trainingstag"></div>
  </header>
  <main>
    <div class="daytitle" id="daytitle"></div>
    <div class="meta" id="meta"></div>
    <div class="general" id="general"></div>
    <div class="list" id="list"></div>
  </main>
</div>
<div class="timer" id="timer" aria-live="polite">
  <div class="t" id="tval">0:00</div>
  <div class="lbl" id="tlbl">Pause</div>
  <button id="tplus" type="button">+30 s</button>
  <button id="tskip" type="button">Fertig</button>
</div>
<div class="toast" id="toast" hidden></div>

const SHORT = {"Tag 1":["Mo","Upper A"],"Tag 2":["Mi","Lower A"],"Tag 3":["Fr","Upper B"],"Tag 4":["So","Lower B"]};
const $ = id => document.getElementById(id);
const today = (() => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })();
let db = null, logs = {}, current = null, session = null, saveTimer = null, saving = Promise.resolve(), mode = "connecting";

function lsGet(){ try { return JSON.parse(localStorage.getItem("recomp-logs")||"{}"); } catch(e){ return {}; } }
function lsSet(){ try { localStorage.setItem("recomp-logs", JSON.stringify(logs)); } catch(e){} }
function sheetCfg(){ try { return JSON.parse(localStorage.getItem("recomp-sheet")||"null"); } catch(e){ return null; } }
function flatRows(body){
  const rows=[]; const day=PLAN.find(d=>d.tag===body.tag);
  Object.keys(body.sets||{}).forEach(id=>{ const ex=(day&&day.ex.find(e=>e.id===id))||{name:id,muscle:""};
    body.sets[id].forEach((st,k)=>{ if(st.done) rows.push([body.date, body.tag, ex.name, ex.muscle, k+1, parseFloat(String(st.kg).replace(",","."))||"", parseInt(st.reps)||""]); }); });
  return rows;
}
function sheetPush(id, body){
  const c=sheetCfg(); if(!c||!c.url) return Promise.resolve(false);
  return fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:c.token,id,data:body,rows:flatRows(body)})})
    .then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error); return true; });
}
function sheetPull(){
  const c=sheetCfg(); if(!c||!c.url) return Promise.resolve(null);
  return fetch(c.url+(c.url.includes("?")?"&":"?")+"token="+encodeURIComponent(c.token||"")).then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error); return j.logs||[]; });
}
function docId(tag){ return today + "_" + tag.replace(" ","-"); }

function pickDefault(){
  const wd = new Date().getDay();
  const map = {1:"Tag 1",3:"Tag 2",5:"Tag 3",0:"Tag 4"};
  if (map[wd]) return map[wd];
  const past = Object.values(logs).filter(l=>l && l.date<=today).sort((a,b)=>a.date<b.date?1:-1);
  if (!past.length) return "Tag 1";
  if (past[0].date===today) return past[0].tag;
  const order=["Tag 1","Tag 2","Tag 3","Tag 4"];
  return order[(order.indexOf(past[0].tag)+1)%4];
}

function lastFor(exId){
  const cand = Object.values(logs).filter(l => l && l.sets && l.sets[exId] && l.sets[exId].some(s=>s.done) && !(l.date===today && session && l.tag===session.tag))
    .sort((a,b)=> a.date<b.date?1:-1);
  if (!cand.length) return null;
  return {date:cand[0].date, sets:cand[0].sets[exId].filter(s=>s.done)};
}
function firstNum(v){ const m=String(v||"").replace(",",".").match(/\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function r25(x){ return Math.max(2.5, Math.round(x/2.5)*2.5); }
const REGION={"Chest":"push","Push Delts":"push","Triceps":"push","Lat":"pull","Traps":"pull","Rear Delts":"pull","Biceps":"pull","Forearms":"pull","Side Delts":"side","Quads":"legs","Hamstrings":"legs","Glutes":"legs","Adductor":"legs","Calves":"legs","Abs":"abs"};
function warmupFor(ex, day, idx, last){
  const reg=REGION[ex.muscle]||ex.muscle;
  const firstInRegion = day.ex.findIndex(e=>(REGION[e.muscle]||e.muscle)===reg)===idx;
  if (!firstInRegion || reg==="abs") return "";
  const kg = last && last.sets.length ? firstNum(last.sets[0].kg) : firstNum(ex.lastLoad);
  const f = x => r25(x).toString().replace(".",",");
  const firstOfDay = idx===0;
  if (firstOfDay){
    return kg ? "<b>"+f(kg*0.5)+" kg × 8</b>, <b>"+f(kg*0.75)+" kg × 3</b>, dann Arbeitssatz" : "2 Sätze: leicht × 8, mittel × 3";
  }
  return kg ? "1 Satz <b>"+f(kg*0.6)+" kg × 5</b>" : "1 Satz leicht × 5";
}
function estimate(day){
  let m=7;
  day.ex.forEach((e,i)=>{ const w=warmupFor(e,day,i,lastFor(e.id)); if(w) m+= /× 8/.test(w)?2:1; m+= e.sets*(e.ss?1.75:(e.kind==="I"?2.5:3)); });
  return Math.round(m);
}
function rangeTop(range){ const m=String(range).match(/(\d+)\s*$/); return m?+m[1]:null; }

function renderDays(){
  const box=$("days"); box.innerHTML="";
  PLAN.forEach(d=>{
    const b=document.createElement("button"); b.type="button"; b.id="day-"+d.tag.replace(" ","");
    b.setAttribute("aria-pressed", String(current===d.tag));
    const [wd,name]=SHORT[d.tag];
    b.innerHTML=wd+"<small>"+name+"</small>";
    b.onclick=()=>{ selectDay(d.tag); };
    box.appendChild(b);
  });
}

function selectDay(tag){
  flush();
  current=tag;
  const id=docId(tag);
  session = logs[id] ? JSON.parse(JSON.stringify(logs[id])) : {date:today, tag, sets:{}};
  renderDays(); render();
}

function ensureSets(ex){
  if (!session.sets[ex.id]) session.sets[ex.id]=Array.from({length:ex.sets},()=>({kg:"",reps:"",done:false}));
  while (session.sets[ex.id].length<ex.sets) session.sets[ex.id].push({kg:"",reps:"",done:false});
  return session.sets[ex.id];
}

function render(){
  const day=PLAN.find(d=>d.tag===current);
  $("daytitle").textContent=day.label;
  const upper=/Upper/.test(day.label);
  $("general").innerHTML = upper
    ? "<b>Aufwärmen allgemein · 7 min</b>5 min Crosstrainer oder Laufband mit Steigung locker, dann je 10x Armkreisen vor/zurück, Band-Pull-Aparts oder leichter Face Pull 2 × 15, Schulter-Außenrotation am Kabel 1 × 15 pro Seite.<br><br><b>Hiatushernie</b>Letzte größere Mahlzeit 2 bis 3 h vorher. Beim Drücken und Ziehen ausatmen, Luft nicht anhalten."
    : "<b>Aufwärmen allgemein · 7 min</b>5 min Rad oder Laufband mit Steigung locker, dann 10 Bodyweight-Squats, 10 Ausfallschritte pro Seite, 10 Hüftbrücken.<br><br><b>Hiatushernie</b>Letzte größere Mahlzeit 2 bis 3 h vorher. Bei jeder Wiederholung in der Anstrengung ausatmen, keine Pressatmung, kein Gürtel eng über dem Bauch. Sodbrennen oder Druck hinter dem Brustbein: Übung abbrechen.";
  const total=day.ex.reduce((a,e)=>a+e.sets,0);
  const done=day.ex.reduce((a,e)=>a+(session.sets[e.id]||[]).filter(s=>s.done).length,0);
  const est=estimate(day);
  $("meta").textContent=done+" / "+total+" Sätze · ca. "+est+" min inkl. Aufwärmen · "+new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const list=$("list"); list.innerHTML="";
  day.ex.forEach((ex,i)=>{
    const sets=ensureSets(ex);
    const last=lastFor(ex.id);
    const card=document.createElement("section");
    card.className="ex"+(ex.ss?(ex.ss[0]==="A"?" ssA":" ssB"):"");
    const nDone=sets.filter(s=>s.done).length;
    let lastTxt, hint="";
    if (last){
      lastTxt="Letztes Mal ("+last.date.slice(8,10)+"."+last.date.slice(5,7)+".): <b>"+last.sets.map(s=>(s.kg||"–")+" × "+(s.reps||"–")).join(", ")+"</b>";
      const t1=rangeTop(ex.r1), t2=rangeTop(ex.r2)||t1;
      const full=last.sets.length>=ex.sets && last.sets.every((s,k)=>+s.reps>=(k===0?t1:t2));
      if (full) hint="Range voll: Last erhöhen (+2,5 bis 5 %)";
    } else {
      lastTxt = ex.lastLoad ? "Aus Mesocycle 3: <b>"+ex.lastLoad+" kg × "+ex.lastReps+"</b>" : "Neue Übung: Startgewicht testen";
    }
    const lastSet0 = last ? last.sets : null;
    const wu = warmupFor(ex, day, i, last);
    card.innerHTML=
      '<div class="exhead"><div class="exname">'+esc(ex.name)+'<div class="tags">'+
        (ex.ss?'<span class="tag ss">Supersatz '+ex.ss+'</span>':'')+
        '<span class="tag">'+esc(ex.muscle)+'</span><span class="tag">RIR '+esc(ex.rir)+'</span><span class="tag">'+esc(ex.tempo)+'</span>'+
        (ex.rest?'<span class="tag">Pause '+fmt(ex.rest)+'</span>':'')+
      '</div></div><div class="done-pill'+(nDone>=ex.sets?' full':'')+'">'+nDone+'/'+ex.sets+'</div></div>'+
      '<div class="last">'+lastTxt+'</div>'+(hint?'<div class="hint">'+hint+'</div>':'')+
      (wu?'<div class="warm">Aufwärmen: '+wu+' <span style="color:var(--muted)">(zählt nicht als Satz)</span></div>':'')+
      '<div class="sets"></div>'+
      '<details><summary>Hinweis</summary>'+esc(ex.tip)+'</details>';
    const box=card.querySelector(".sets");
    sets.forEach((s,k)=>{
      const row=document.createElement("div"); row.className="set"+(s.done?" on":"");
      const ph = lastSet0 && lastSet0[k] ? lastSet0[k] : (lastSet0 && lastSet0.length ? lastSet0[lastSet0.length-1] : null);
      const kgPh = ph ? ph.kg : (ex.lastLoad && /^[\d.]+$/.test(ex.lastLoad) ? ex.lastLoad : "kg");
      const rng = k===0 ? ex.r1 : (ex.r2 && ex.r2!=="-" ? ex.r2 : ex.r1);
      row.innerHTML='<div class="n">'+(k+1)+'</div>'+
        '<label class="field"><input id="kg-'+ex.id+'-'+k+'" inputmode="decimal" placeholder="'+esc(String(kgPh))+'" value="'+esc(s.kg)+'" aria-label="Gewicht Satz '+(k+1)+'"><span>kg</span></label>'+
        '<label class="field"><input id="rp-'+ex.id+'-'+k+'" inputmode="numeric" placeholder="'+esc(rng)+'" value="'+esc(s.reps)+'" aria-label="Wiederholungen Satz '+(k+1)+'"><span>Wdh</span></label>'+
        '<button type="button" class="chk" aria-pressed="'+s.done+'" aria-label="Satz '+(k+1)+' erledigt">✓</button>'+
        '<div class="range">Ziel '+esc(rng)+' Wdh</div>';
      const [kgI,rpI]=row.querySelectorAll("input");
      kgI.oninput=()=>{ s.kg=kgI.value.replace(",","."); queueSave(); };
      rpI.oninput=()=>{ s.reps=rpI.value; queueSave(); };
      row.querySelector(".chk").onclick=()=>{
        unlockAudio();
        if (!s.done){
          if (!s.kg && kgI.placeholder && /^[\d.]+$/.test(kgI.placeholder)) s.kg=kgI.placeholder;
          s.done=true; queueSave(); render();
          if (ex.ss && ex.ss[0]==="A"){
            const partner=day.ex.find(e=>e.ss==="B"+ex.ss.slice(1));
            toast("Weiter ohne Pause: "+(partner?partner.name:"B-Übung"));
          } else startTimer(ex.rest||90, ex.name);
        } else { s.done=false; queueSave(); render(); }
      };
      box.appendChild(row);
    });
    list.appendChild(card);
  });
}
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); }
function flush(){
  if (!session) return;
  clearTimeout(saveTimer);
  const hasData=Object.values(session.sets).some(a=>a.some(s=>s.kg||s.reps||s.done));
  if (!hasData) return;
  const id=docId(session.tag);
  const body=JSON.parse(JSON.stringify(session));
  body.updated=Date.now();
  logs[id]=body;
  if (db){
    saving = saving.then(()=>db.collection("logs").doc(id).set(body)).then(()=>setStatus("Gespeichert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}))).catch(e=>{ lsSet(); setStatus("Cloud-Fehler, lokal gesichert"); });
  } else {
    lsSet();
    if (sheetCfg()) { saving = saving.then(()=>sheetPush(id, body)).then(()=>setStatus("Im Sheet gespeichert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}))).catch(()=>setStatus("Sheet nicht erreichbar, lokal gesichert")); }
    else setStatus("Lokal gespeichert");
  }
}
function setStatus(t){ $("status").textContent=t; }

// Rest timer
let tEnd=0, tInt=null, actx=null;
function unlockAudio(){
  try { if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==="suspended") actx.resume(); } catch(e){}
  if (navigator.wakeLock && !window._wl){ navigator.wakeLock.request("screen").then(w=>{window._wl=w; w.addEventListener("release",()=>{window._wl=null;});}).catch(()=>{}); }
}
function beep(){
  if(!actx) return;
  try { [0,0.25,0.5].forEach(o=>{ const g=actx.createGain(), osc=actx.createOscillator(); osc.frequency.value=880; g.gain.value=0.25; osc.connect(g); g.connect(actx.destination); osc.start(actx.currentTime+o); osc.stop(actx.currentTime+o+0.15); }); } catch(e){}
}
function startTimer(sec,label){
  tEnd=Date.now()+sec*1000; $("tlbl").textContent="Pause nach "+label;
  $("timer").classList.add("show"); $("timer").classList.remove("zero");
  clearInterval(tInt); tick(); tInt=setInterval(tick,250);
}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $("tval").textContent=fmt(left);
  if(left===0 && !$("timer").classList.contains("zero")){ $("timer").classList.add("zero"); $("tlbl").textContent="Nächster Satz"; beep(); }
}
$("tplus").onclick=()=>{ tEnd=Math.max(tEnd,Date.now())+30000; $("timer").classList.remove("zero"); tick(); };
$("tskip").onclick=()=>{ clearInterval(tInt); $("timer").classList.remove("show"); };
let toastT=null;
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2600); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); else if(navigator.wakeLock && !window._wl && actx){ navigator.wakeLock.request("screen").then(w=>{window._wl=w;}).catch(()=>{}); } });

// Boot: local first, then cloud
logs=lsGet(); current=pickDefault(); selectDay(current);
let fallback=setTimeout(()=>{ if(mode==="connecting"){ mode="local"; setStatus("Nur lokal gespeichert"); } },10000);
(async()=>{
  try {
    const d = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if(!d){ clearTimeout(fallback); mode="local"; startSheet(); return; }
    db=d;
    let first=true;
    db.collection("logs").onSnapshot(snap=>{
      clearTimeout(fallback); mode="cloud";
      const local=lsGet();
      const remote={}; snap.docs.forEach(doc=>{ if(doc.exists) remote[doc.id]=doc.data(); });
      // push anything that only exists locally
      if(first){ Object.keys(local).forEach(k=>{ if(!remote[k] || (local[k].updated||0)>(remote[k].updated||0)){ remote[k]=local[k]; saving=saving.then(()=>db.collection("logs").doc(k).set(local[k])).catch(()=>{}); } }); first=false; }
      const mine = session ? docId(session.tag) : null;
      const keepSession = mine && logs[mine] && remote[mine] && (logs[mine].updated||0) > (remote[mine].updated||0);
      logs=remote; if(keepSession) logs[mine]=JSON.parse(JSON.stringify(session));
      lsSet();
      setStatus("Synchronisiert");
      const active=document.activeElement && document.activeElement.tagName==="INPUT";
      if(!active) render();
    }, err=>{ mode="local"; setStatus("Cloud nicht erreichbar, lokal"); });
  } catch(e){ clearTimeout(fallback); mode="local"; startSheet(); }
})();
function startSheet(){
  if(!sheetCfg()){ setStatus("Nur lokal gespeichert"); return; }
  setStatus("Lade aus Sheet…");
  sheetPull().then(list=>{
    const local=lsGet(); const merged=Object.assign({},local);
    (list||[]).forEach(x=>{ if(x&&x.data&&(!merged[x.id]||(x.data.updated||0)>(merged[x.id].updated||0))) merged[x.id]=x.data; });
    Object.keys(local).forEach(k=>{ const r=(list||[]).find(x=>x.id===k); if(!r||(local[k].updated||0)>(r.data.updated||0)) sheetPush(k,local[k]).catch(()=>{}); });
    logs=merged; lsSet();
    const mine=docId(current); if(logs[mine]) session=JSON.parse(JSON.stringify(logs[mine]));
    render(); setStatus("Mit Sheet synchronisiert");
  }).catch(()=>setStatus("Sheet nicht erreichbar, lokal"));
}
$("gear").onclick=()=>{ const st=$("settings"); st.hidden=!st.hidden; const c=sheetCfg()||{}; $("sheetUrl").value=c.url||""; $("sheetToken").value=c.token||""; };
$("sheetSave").onclick=()=>{ const url=$("sheetUrl").value.trim(), token=$("sheetToken").value.trim();
  try { if(url) localStorage.setItem("recomp-sheet",JSON.stringify({url,token})); else localStorage.removeItem("recomp-sheet"); } catch(e){}
  $("settings").hidden=true; if(!db) startSheet(); };
</script>
